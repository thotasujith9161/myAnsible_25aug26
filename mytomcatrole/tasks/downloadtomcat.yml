---
- name: Download Tomcat
  get_url:
    url: https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz
    dest: /home/maha
    mode: '0644'
    force_basic_auth: yes

- name: create tomcat directory
  file:
    path: /opt/tomcat
    state: directory

- name: extract tomcat
  ansible.builtin.unarchive:
    src: /home/maha/apache-tomcat-10.1.60.tar.gz
    dest: /opt/tomcat
    remote_src: yes
    extra_opts:
    - -C
