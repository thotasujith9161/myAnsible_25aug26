---
- name: copy tomcat-users.xml to /opt/tomcat/conf
  template:
    src: templates/tomcat-users.xml.j2
    dest: /opt/tomcat/conf/tomcat-users.xml

- name: copy context.xml to /opt/tomcat/webapps/manager/META-INF
  template:
    src: templates/context.xml.j2
    dest: /opt/tomcat/webapps/manager/META-INF/context.xml

- name: copy host context.xml to /opt/tomcat/webapps/host-manager/META-INF
  template:
    src: templates/host-context.xml.j2
    dest: /opt/tomcat/webapps/host-manager/META-INF/context.xml